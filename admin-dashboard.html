<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Track - Admin Portal</title>
    <link rel="stylesheet" href="dashboard.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="dashboard-layout">
        
        <!-- Admin Sidebar Navigation -->
        <aside class="sidebar admin-sidebar">
            <div class="sidebar-header">
                <a href="sign-in.html" class="nav-link back-link admin-back">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                    Back
                </a>
                <div class="logo-container small-logo admin-logo">
                    <div class="filled-heart-icon">
                        <svg viewBox="0 0 24 24" fill="white" width="16" height="16">
                            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                        </svg>
                    </div>
                    <span class="logo-text-small">Health Track</span>
                </div>
            </div>

            <nav class="sidebar-nav admin-nav">
                <!-- Links mapped exactly to the design spelling and upcoming pages -->
                <a href="admin-manage-users.html" class="nav-link admin-nav-link">Manage Users</a>
                <a href="admin-approve-dietitians.html" class="nav-link admin-nav-link">Approve Dictitians</a>
                <a href="#" class="nav-link admin-nav-link">Food Database</a>
                <a href="admin-generate-reports.html" class="nav-link admin-nav-link">Generate reports</a>
            </nav>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content admin-main-hub">
            <div class="admin-dashboard-grid">
                
                <!-- Manage Users Card -->
                <a href="admin-manage-users.html" class="admin-hub-card card-manage">
                    <div class="icon-wrapper icon-green">
                        <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                            <circle cx="9" cy="7" r="4"></circle>
                            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                        </svg>
                    </div>
                    <h3>Manage Users</h3>
                </a>

                <!-- Approve Dietitians Card -->
                <a href="admin-approve-dietitians.html" class="admin-hub-card card-approve">
                    <div class="icon-wrapper icon-blue">
                        <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                            <polyline points="16 11 18 13 22 9"></polyline>
                        </svg>
                    </div>
                    <h3>Approve Dictitians</h3>
                </a>

                <!-- Food Database Card -->
                <a href="#" class="admin-hub-card card-food">
                    <div class="icon-wrapper icon-orange">
                        <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
                            <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path>
                            <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path>
                        </svg>
                    </div>
                    <h3>Food Database</h3>
                </a>

                <!-- Generate Reports Card -->
                <a href="admin-generate-reports.html" class="admin-hub-card card-reports">
                    <div class="icon-wrapper icon-purple">
                        <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                            <polyline points="14 2 14 8 20 8"></polyline>
                            <line x1="12" y1="18" x2="12" y2="12"></line>
                            <line x1="8" y1="18" x2="8" y2="15"></line>
                            <line x1="16" y1="18" x2="16" y2="15"></line>
                        </svg>
                    </div>
                    <h3>Generate reports</h3>
                </a>

            </div>
        </main>
    </div>
</body>
</html>
